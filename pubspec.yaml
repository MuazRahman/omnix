name: omnix
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dropdown_button2: ^3.1.0
  go_router: ^18.1.0
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  http: ^1.6.0
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0




flutter:

  uses-material-design: true

  assets:
    - assets/images/menu/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

